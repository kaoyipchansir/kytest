<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>普通話學習助手</title>
                <style>  
                        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
                                .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
                                        h1 { font-size: 1.8rem; color: #333; }
                                                .phrase-box { font-size: 2rem; margin: 25px 0; color: #0056b3; font-weight: bold; min-height: 60px; }
                                                        button { font-size: 1.2rem; padding: 12px 20px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; color: white; width: 80%; max-width: 300px; }
                                                                .btn-gen { background-color: #17a2b8; }
                                                                        .btn-play { background-color: #28a745; }
                                                                                .btn-record { background-color: #dc3545; }
                                                                                        .result-box { margin-top: 25px; font-size: 1.3rem; font-weight: bold; line-height: 1.5; min-height: 80px; }
                                                                                                .debug-info { margin-top: 20px; font-size: 0.9rem; color: #888; }
                                                                                                    </style>
                                                                                                    </head>
                                                                                                    <body>

                                                                                                    <div class="container">
                                                                                                        <h1>💬 普通話發音練習</h1>
                                                                                                            
                                                                                                                <!-- 顯示目標句子 -->
                                                                                                                    <div id="targetPhrase" class="phrase-box">點擊生成獲取句子...</div>
                                                                                                                        
                                                                                                                            <button class="btn-gen" onclick="generatePhrase()">1. 產生句子 (Dify)</button>
                                                                                                                                <button class="btn-play" onclick="playAudio()">2. 聽示範發音</button>
                                                                                                                                    <button class="btn-record" id="recordBtn" onclick="startRecording()">3. 點擊開始朗讀</button>
                                                                                                                                        
                                                                                                                                            <!-- 顯示辨識結果或錯誤訊息 -->
                                                                                                                                                <div id="resultText" class="result-box"></div>
                                                                                                                                                    
                                                                                                                                                        <!-- 顯示系統狀態 (除錯用) -->
                                                                                                                                                            <div id="debugText" class="debug-info">系統準備就緒。請確保平板已連接網際網路。</div>
                                                                                                                                                            </div>

                                                                                                                                                            <script>
                                                                                                                                                                let currentPhrase = "";

                                                                                                                                                                    // ==========================================
                                                                                                                                                                        // 1. Dify API 串接 (生成句子)
                                                                                                                                                                            // ==========================================
                                                                                                                                                                                async function generatePhrase() {
                                                                                                                                                                                        // ⚠️ 請在這裡填寫你的 Dify API Key
                                                                                                                                                                                                const API_KEY = 'YOUR_DIFY_API_KEY'; 
                                                                                                                                                                                                        const API_URL = 'https://api.dify.ai/v1/chat-messages'; 

                                                                                                                                                                                                                const requestData = {
                                                                                                                                                                                                                            "inputs": {}, 
                                                                                                                                                                                                                                        "query": "請給我一句適合練習普通話發音的日常用語，字數在5到10字之間。請直接回覆句子本身，不要包含拼音、引號或任何其他解釋文字。",
                                                                                                                                                                                                                                                    "response_mode": "blocking", 
                                                                                                                                                                                                                                                                "conversation_id": "",       
                                                                                                                                                                                                                                                                            "user": "student-01"         
                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                            const targetBox = document.getElementById('targetPhrase');
                                                                                                                                                                                                                                                                                                    const resultBox = document.getElementById('resultText');
                                                                                                                                                                                                                                                                                                            const debugBox = document.getElementById('debugText');
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                            targetBox.innerText = "⏳ 句子生成中...";
                                                                                                                                                                                                                                                                                                                                    resultBox.innerText = "";
                                                                                                                                                                                                                                                                                                                                            debugBox.innerText = "正在呼叫 Dify API...";

                                                                                                                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                                                                                                                const response = await fetch(API_URL, {
                                                                                                                                                                                                                                                                                                                                                                                method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                    'Authorization': `Bearer ${API_KEY}`,
                                                                                                                                                                                                                                                                                                                                                                                                                                        'Content-Type': 'application/json'
                                                                                                                                                                                                                                                                                                                                                                                                                                                        },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        body: JSON.stringify(requestData)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                throw new Error(`狀態碼：${response.status}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const result = await response.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    currentPhrase = result.answer.trim(); 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                targetBox.innerText = currentPhrase;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            debugBox.innerText = "✅ 句子生成成功！";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.error("API 錯誤:", error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            targetBox.innerText = "❌ 生成失敗";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        debugBox.innerText = `API 請求失敗: ${error.message} (請檢查 API Key 或網路連線)`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 2. 語音朗讀 (TTS)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function playAudio() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!currentPhrase) return alert("請先產生句子！");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 確保先停止上一次的語音，避免卡彈
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.speechSynthesis.cancel();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const utterance = new SpeechSynthesisUtterance(currentPhrase);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            utterance.lang = 'zh-CN'; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    utterance.rate = 0.8;     
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.speechSynthesis.speak(utterance);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('debugText').innerText = "🔊 正在播放示範語音...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 3. 語音辨識 (STT) 與比對邏輯
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // ==========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let recognition;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (SpeechRecognition) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                recognition = new SpeechRecognition();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        recognition.lang = 'zh-CN'; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                recognition.interimResults = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // 錄音開始時的視覺提示
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        recognition.onstart = function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('recordBtn').innerText = "🎙️ 聆聽中 (請說話)...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('recordBtn').style.backgroundColor = "#ffc107"; // 變成黃色
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('resultText').innerText = "正在收音...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('debugText').innerText = "麥克風運作中，請對著平板說話。";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 成功辨識出文字時的處理
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                recognition.onresult = function(event) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const userSaid = event.results[0][0].transcript;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('debugText').innerText = "✅ 成功將語音轉換為文字！";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    checkPronunciation(userSaid);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // 發生錯誤時的處理機制 (找 BUG 專用)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            recognition.onerror = function(event) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const resultBox = document.getElementById('resultText');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultBox.style.color = "red";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let errorMsg = `❌ 錯誤代碼: ${event.error}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (event.error === 'not-allowed') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        errorMsg = "❌ 權限被拒絕：請確認 Chrome 已經允許麥克風。";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else if (event.error === 'network' || event.error === 'service-not-allowed') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    errorMsg = "❌ 網路錯誤：平板必須連上網際網路，才能將語音傳給 Google 進行文字轉換！";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else if (event.error === 'no-speech') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                errorMsg = "❌ 聽不到聲音：請靠近平板再試一次。";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultBox.innerText = errorMsg;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('debugText').innerText = `語音引擎報告錯誤: ${event.error}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            resetRecordButton();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 錄音結束時重置按鈕狀態
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recognition.onspeechend = function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                recognition.stop();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            resetRecordButton();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };
