<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>普通話學習助手 (本地測試版)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { font-size: 1.8rem; color: #333; }
        .phrase-box { font-size: 2rem; margin: 25px 0; color: #0056b3; font-weight: bold; min-height: 60px; }
        button { font-size: 1.2rem; padding: 12px 20px; margin: 10px; border: none; border-radius: 8px; cursor: pointer; color: white; width: 80%; max-width: 300px; }
        .btn-gen { background-color: #17a2b8; }
        .btn-play { background-color: #28a745; }
        .btn-record { background-color: #dc3545; }
        .result-box { margin-top: 25px; font-size: 1.3rem; font-weight: bold; line-height: 1.5; min-height: 80px; }
        .debug-info { margin-top: 20px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h1>💬 普通話發音練習 (本地測試)</h1>
    
    <div id="targetPhrase" class="phrase-box">點擊生成獲取句子...</div>
    
    <button class="btn-gen" onclick="generatePhrase()">1. 產生句子 (本地)</button>
    <button class="btn-play" onclick="playAudio()">2. 聽示範發音</button>
    <button class="btn-record" id="recordBtn" onclick="startRecording()">3. 點擊開始朗讀</button>
    
    <div id="resultText" class="result-box"></div>
    <div id="debugText" class="debug-info">系統準備就緒。請測試麥克風功能。</div>
</div>

<script>
    let currentPhrase = "";

    // ==========================================
    // 1. 本地隨機句子 (略過 Dify API)
    // ==========================================
    function generatePhrase() {
        const mockPhrases = [
            "你好，很高興認識你", 
            "請問地鐵站怎麼走", 
            "這杯咖啡多少錢", 
            "今天天氣非常不錯",
            "我想吃一個漢堡包",
            "你的普通話說得真好"
        ];
        
        const randomIndex = Math.floor(Math.random() * mockPhrases.length);
        currentPhrase = mockPhrases[randomIndex]; 
        
        document.getElementById('targetPhrase').innerText = currentPhrase;
        document.getElementById('resultText').innerText = "";
        document.getElementById('debugText').innerText = "✅ 已載入本地句子。";
    }

    // ==========================================
    // 2. 語音朗讀 (TTS)
    // ==========================================
    function playAudio() {
        if (!currentPhrase) return alert("請先產生句子！");
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(currentPhrase);
        utterance.lang = 'zh-CN'; 
        utterance.rate = 0.8;     
        window.speechSynthesis.speak(utterance);
        
        document.getElementById('debugText').innerText = "🔊 正在播放示範語音...";
    }

    // ==========================================
    // 3. 語音辨識 (STT) 與比對邏輯
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        
        recognition.onstart = function() {
            document.getElementById('recordBtn').innerText = "🎙️ 聆聽中 (請說話)...";
            document.getElementById('recordBtn').style.backgroundColor = "#ffc107";
            document.getElementById('resultText').innerText = "正在收音...";
            document.getElementById('debugText').innerText = "麥克風運作中，請對著平板說話。";
        };

        recognition.onresult = function(event) {
            const userSaid = event.results[0][0].transcript;
            document.getElementById('debugText').innerText = "✅ 成功接收語音！";
            checkPronunciation(userSaid);
        };

        recognition.onerror = function(event) {
            const resultBox = document.getElementById('resultText');
            resultBox.style.color = "red";
            
            let errorMsg = `❌ 錯誤代碼: ${event.error}`;
            if (event.error === 'not-allowed') {
                errorMsg = "❌ 權限被拒絕：請確認 Chrome 已經允許麥克風。";
            } else if (event.error === 'network' || event.error === 'service-not-allowed') {
                errorMsg = "❌ 網路錯誤：平板必須連上網際網路，才能進行文字轉換！";
            } else if (event.error === 'no-speech') {
                errorMsg = "❌ 聽不到聲音：請靠近平板再試一次。";
            }
            
            resultBox.innerText = errorMsg;
            document.getElementById('debugText').innerText = `語音引擎報告錯誤: ${event.error}`;
            resetRecordButton();
        };

        recognition.onspeechend = function() {
            recognition.stop();
            resetRecordButton();
        };
        
        recognition.onend = function() {
            resetRecordButton();
        };

    } else {
        alert("你的瀏覽器不支援語音辨識功能，請使用 Chrome 瀏覽器。");
    }

    function startRecording() {
        if (!currentPhrase) return alert("請先產生句子！");
        if (recognition) {
            try {
                recognition.start();
            } catch (e) {
                recognition.stop();
                setTimeout(() => recognition.start(), 200);
            }
        }
    }

    function resetRecordButton() {
        const btn = document.getElementById('recordBtn');
        btn.innerText = "3. 點擊開始朗讀";
        btn.style.backgroundColor = "#dc3545"; 
    }

    // ==========================================
    // 4. 文字比對邏輯
    // ==========================================
    function checkPronunciation(userSaid) {
        const resultBox = document.getElementById('resultText');
        const cleanTarget = currentPhrase.replace(/[，。！？、,!?]/g, '').trim();
        const cleanUser = userSaid.replace(/[，。！？、,!?]/g, '').trim();

        if (cleanTarget === cleanUser) {
            resultBox.style.color = "green";
            resultBox.innerHTML = `✅ 發音完美！你說了：<br>"${userSaid}"`;
        } else {
            resultBox.style.color = "red";
            resultBox.innerHTML = `❌ 還差一點！<br>你說了："${userSaid}"<br>標準是："${cleanTarget}"`;
        }
    }
</script>

</body>
</html>
